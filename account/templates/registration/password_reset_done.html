{% extends "base.html" %}

{% block title %}Instructions Sent{% endblock %}

{% block content %}
<div class="min-h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 border border-zinc-200 rounded-xl shadow-sm text-center">

        <!-- Icon -->
        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-violet-100">
            <svg class="h-6 w-6 text-violet-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75m19.5 0A2.25 2.25 0 0019.5 4.5h-15a2.25 2.25 0 00-2.25 2.25m19.5 0v.243a2.25 2.25 0 01-1.07 1.916l-7.5 4.615a2.25 2.25 0 01-2.36 0L3.32 8.91a2.25 2.25 0 01-1.07-1.916V6.75" />
            </svg>
        </div>

        <!-- Header -->
        <div>
            <h2 class="text-2xl font-bold tracking-tight text-zinc-900">
                Check your inbox
            </h2>
            <p class="mt-2 text-sm text-zinc-500">
                We've sent you an email with instructions on how to reset your password.
            </p>
        </div>

        <!-- Call to Action Button -->
        <div class="mt-6">
            <a href="{% url 'login' %}"
                class="inline-flex w-full justify-center items-center py-2.5 px-4 border border-transparent text-sm font-semibold rounded-lg text-white bg-zinc-900 hover:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-zinc-900 transition-colors">
                Back to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
