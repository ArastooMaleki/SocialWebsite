{% extends "base.html" %}

{% block title %}Password Changed | Bookmarks{% endblock %}

<!-- Optional: Hide navbar/footer for a more focused "success" screen -->
{# {% block navbar %}{% endblock %} #}
{# {% block footer %}{% endblock %} #}

{% block content %}
<div class="min-h-full flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 border border-zinc-200 rounded-xl shadow-sm text-center">

        <!-- Icon -->
        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-green-100">
            <svg class="h-6 w-6 text-green-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" d="M4.5 12.75l6 6 9-13.5" />
            </svg>
        </div>

        <!-- Header -->
        <div>
            <h2 class="text-2xl font-bold tracking-tight text-zinc-900">
                Password changed successfully
            </h2>
            <p class="mt-2 text-sm text-zinc-500">
                Your password has been updated.
            </p>
        </div>

        <!-- Call to Action Button -->
        <div class="mt-6">
            <a href="{% url 'dashboard' %}"
                class="inline-flex w-full justify-center items-center py-2.5 px-4 border border-transparent text-sm font-semibold rounded-lg text-white bg-zinc-900 hover:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-zinc-900 transition-colors">
                Go to Dashboard
            </a>
        </div>

    </div>
</div>
{% endblock %}
