{% extends "base.html" %}

{% block title %}Logged Out{% endblock %}

<!-- Hide navigation on the logged out page -->
{% block navbar %}{% endblock %}

<!-- Hide footer on the logged out page -->
{% block footer %}{% endblock %}

{% block content %}
<div class="min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 bg-white p-8 border border-zinc-200 rounded-xl shadow-sm text-center">

        <!-- Icon -->
        <div class="mx-auto flex items-center justify-center h-12 w-12 rounded-full bg-zinc-100">
            <svg class="h-6 w-6 text-zinc-600" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15M12 9l-3 3m0 0l3 3m-3-3h12.75" />
            </svg>
        </div>

        <!-- Header -->
        <div>
            <h2 class="text-2xl font-bold tracking-tight text-zinc-900">
                You have been signed out
            </h2>
            <p class="mt-2 text-sm text-zinc-500">
                Thank you for spending time with us.
            </p>
        </div>

        <!-- Call to Action Button -->
        <div class="mt-6">
            <a href="{% url 'login' %}"
                class="inline-flex w-full justify-center items-center py-2.5 px-4 border border-transparent text-sm font-semibold rounded-lg text-white bg-zinc-900 hover:bg-zinc-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-zinc-900 transition-colors">
                Sign In Again
            </a>
        </div>

    </div>
</div>
{% endblock %}
